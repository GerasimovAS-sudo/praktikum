<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f0f1a">
<title>Практикум — Магия утра</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
--bg:#0a0a14;--card:#161625;--card2:#1f1f35;--accent:#7c5cff;--accent2:#a78bfa;
--text:#eceaf5;--muted:#8a8aa5;--success:#00d68f;--border:#26264a;--gold:#ffb800;
}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;-webkit-font-smoothing:antialiased}
.hidden{display:none!important}

/* === ЭКРАН ВХОДА === */
.auth{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:30px 24px;max-width:440px;margin:0 auto}
.auth-logo{text-align:center;margin-bottom:36px}
.auth-logo .ico{font-size:56px;margin-bottom:12px}
.auth-logo h1{font-size:28px;font-weight:800;background:linear-gradient(135deg,var(--accent2),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:6px}
.auth-logo p{color:var(--muted);font-size:14px}
.auth-tabs{display:flex;background:var(--card);border-radius:14px;padding:4px;margin-bottom:20px}
.auth-tab{flex:1;text-align:center;padding:11px;border-radius:10px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;transition:.2s}
.auth-tab.on{background:var(--accent);color:#fff}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.field input{width:100%;background:var(--card);border:1.5px solid var(--border);border-radius:13px;padding:15px 16px;color:var(--text);font-size:16px;font-family:inherit;transition:.2s}
.field input:focus{outline:none;border-color:var(--accent);background:var(--card2)}
.field input::placeholder{color:#5a5a75}
.btn{width:100%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;padding:16px;border-radius:13px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;transition:.2s;margin-top:6px}
.btn:active{transform:scale(.98);opacity:.9}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-ghost{background:transparent;border:1.5px solid var(--border);color:var(--text)}
.btn-ghost:active{background:var(--card)}
.err{color:#ff5c5c;font-size:13px;text-align:center;margin-top:12px;min-height:18px}
.auth-hint{text-align:center;color:var(--muted);font-size:12px;margin-top:20px;line-height:1.5}

/* === ОБЩИЙ КОНТЕЙНЕР === */
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 100px}

/* === ВЕРХНЯЯ ПАНЕЛЬ === */
.topbar{display:flex;justify-content:space-between;align-items:center;padding:8px 0 20px}
.topbar .user{display:flex;align-items:center;gap:10px}
.topbar .ava{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff}
.topbar .phone{font-size:13px;color:var(--muted)}
.topbar .logout{background:transparent;border:1px solid var(--border);color:var(--muted);padding:6px 12px;border-radius:9px;font-size:12px;cursor:pointer;font-family:inherit}

/* === ОНБОРДИНГ === */
.onb{min-height:100vh;padding:30px 24px;max-width:560px;margin:0 auto;display:flex;flex-direction:column}
.onb-step{flex:1;display:flex;flex-direction:column;justify-content:center;padding:20px 0}
.onb-ico{font-size:60px;text-align:center;margin-bottom:20px}
.onb h2{font-size:24px;font-weight:800;margin-bottom:16px;line-height:1.3}
.onb p{font-size:16px;color:#c5c5d8;line-height:1.7;margin-bottom:14px}
.onb ul{margin:12px 0 14px 0;padding-left:0;list-style:none}
.onb ul li{font-size:15px;color:#c5c5d8;padding:8px 0 8px 28px;position:relative;line-height:1.6}
.onb ul li::before{content:'✦';position:absolute;left:4px;color:var(--accent2);font-size:14px}
.onb-dots{display:flex;gap:6px;justify-content:center;margin:20px 0}
.onb-dot{width:8px;height:8px;border-radius:50%;background:var(--border);transition:.2s}
.onb-dot.on{background:var(--accent);width:24px;border-radius:4px}
.onb-nav{display:flex;gap:10px}

/* === ГЛАВНЫЙ ЭКРАН === */
.hello{margin-bottom:20px}
.hello h1{font-size:26px;font-weight:800;margin-bottom:4px}
.hello p{color:var(--muted);font-size:14px}
.streak-bar{background:linear-gradient(135deg,rgba(124,92,255,.15),rgba(167,139,250,.1));border:1px solid var(--border);border-radius:16px;padding:16px;display:flex;align-items:center;gap:14px;margin-bottom:20px}
.streak-fire{font-size:36px}
.streak-info h3{font-size:18px;font-weight:700}
.streak-info p{font-size:13px;color:var(--muted)}

.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:20px;margin-bottom:14px}
.card-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.card-head h2{font-size:17px;font-weight:700}
.card-head .pc{font-size:22px;font-weight:800;color:var(--accent2)}
.pbar{height:8px;background:var(--card2);border-radius:4px;overflow:hidden;margin-bottom:8px}
.pfill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:4px;transition:width .4s;width:0}
.psub{font-size:13px;color:var(--muted)}
.days{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:16px}
.day{aspect-ratio:1;background:var(--card2);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;border:1.5px solid transparent;transition:.2s}
.day.done{background:linear-gradient(135deg,var(--success),#00b377);color:#fff;border-color:transparent}
.day.today{border-color:var(--accent2);color:var(--accent2);font-weight:700}

.big-btn{background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:18px;padding:22px;display:flex;align-items:center;gap:16px;cursor:pointer;margin-bottom:20px;transition:.2s;border:none;width:100%;color:#fff;font-family:inherit;text-align:left}
.big-btn:active{transform:scale(.98)}
.big-btn .bico{font-size:40px}
.big-btn h3{font-size:18px;font-weight:800;margin-bottom:3px}
.big-btn p{font-size:13px;opacity:.9}

.section-title{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:24px 0 12px}

.practice{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:10px;cursor:pointer;display:flex;gap:14px;align-items:center;transition:.2s}
.practice:active{transform:scale(.99);border-color:var(--accent)}
.practice.done{opacity:.6}
.practice.done .p-title{text-decoration:line-through}
.p-ico{font-size:30px;flex-shrink:0}
.p-body{flex:1;min-width:0}
.p-title{font-weight:700;font-size:16px;margin-bottom:3px}
.p-sub{font-size:13px;color:var(--muted)}
.p-arrow{font-size:20px;color:var(--muted);flex-shrink:0}
.p-check{width:26px;height:26px;border:2px solid var(--border);border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:transparent;transition:.2s}
.practice.done .p-check{background:var(--success);border-color:var(--success);color:#fff}

/* === ЭКРАН ПРАКТИКИ === */
.practice-screen{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);z-index:200;overflow-y:auto;padding-bottom:100px}
.ps-head{position:sticky;top:0;background:var(--bg);padding:16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);z-index:1}
.ps-back{background:var(--card);border:1px solid var(--border);width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;color:var(--text);font-family:inherit}
.ps-head-text{flex:1}
.ps-head-text h2{font-size:18px;font-weight:800}
.ps-head-text p{font-size:12px;color:var(--muted)}
.ps-content{padding:20px 16px}
.ps-hero{text-align:center;padding:24px 20px;background:linear-gradient(135deg,rgba(124,92,255,.15),rgba(167,139,250,.08));border-radius:20px;margin-bottom:24px}
.ps-hero .ico{font-size:56px;margin-bottom:10px}
.ps-hero .time{display:inline-block;background:rgba(124,92,255,.25);color:var(--accent2);padding:6px 14px;border-radius:20px;font-size:13px;font-weight:700;margin-top:6px}
.ps-block{margin-bottom:26px}
.ps-block h3{font-size:15px;font-weight:800;color:var(--accent2);text-transform:uppercase;letter-spacing:.8px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.ps-block p{font-size:15px;color:#c5c5d8;line-height:1.7;margin-bottom:10px}
.steps{list-style:none;counter-reset:step}
.steps li{counter-increment:step;padding:14px 14px 14px 52px;background:var(--card);border:1px solid var(--border);border-radius:13px;margin-bottom:8px;position:relative;font-size:15px;line-height:1.6}
.steps li::before{content:counter(step);position:absolute;left:14px;top:14px;width:26px;height:26px;background:var(--accent);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.affirm-list{list-style:none;display:flex;flex-direction:column;gap:8px}
.affirm-list li{background:var(--card);border:1px solid var(--border);border-left:3px solid var(--accent2);border-radius:10px;padding:13px 15px;font-size:15px;font-style:italic;color:#dcdcf0;cursor:pointer;transition:.2s}
.affirm-list li:active{background:var(--card2)}
.mistakes{list-style:none}
.mistakes li{padding:10px 0 10px 28px;position:relative;font-size:14px;color:#c5c5d8;line-height:1.6}
.mistakes li::before{content:'✕';position:absolute;left:0;color:#ff5c5c;font-weight:700}
.advice{background:linear-gradient(135deg,rgba(255,184,0,.1),rgba(255,184,0,.03));border:1px solid rgba(255,184,0,.3);border-radius:13px;padding:16px;font-size:14px;line-height:1.7;color:#e8ddc5;font-style:italic}
.advice::before{content:'💡 ';font-style:normal}

/* === ТАЙМЕР === */
.timer-box{text-align:center;padding:20px;background:var(--card);border:1px solid var(--border);border-radius:18px;margin-bottom:22px}
.timer-display{font-size:52px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent2);margin-bottom:14px;letter-spacing:2px}
.timer-btns{display:flex;gap:10px}
.timer-btns .btn{margin-top:0}

/* === ДНЕВНИК === */
.journal-q{font-size:14px;font-weight:700;color:var(--accent2);margin-bottom:8px;margin-top:16px}
.journal textarea{width:100%;background:var(--card);border:1.5px solid var(--border);border-radius:13px;padding:14px;color:var(--text);font-family:inherit;font-size:14px;resize:vertical;min-height:80px;line-height:1.6}
.journal textarea:focus{outline:none;border-color:var(--accent)}

/* === PWA меню === */
.menu{position:fixed;bottom:0;left:0;right:0;background:rgba(22,22,37,.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:10px 0 22px;z-index:100}
.menu-item{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:10px;cursor:pointer;padding:4px 14px;transition:.2s;background:none;border:none;font-family:inherit}
.menu-item.on{color:var(--accent2)}
.menu-item .mi-ico{font-size:22px}

/* === ДОСТИЖЕНИЯ === */
.achievement{display:flex;gap:14px;align-items:center;padding:14px;background:var(--card);border:1px solid var(--border);border-radius:14px;margin-bottom:10px}
.achievement.locked{opacity:.4}
.ach-badge{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,var(--gold),#ff8c00);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.achievement.locked .ach-badge{background:var(--card2)}
.ach-info h4{font-size:15px;font-weight:700;margin-bottom:2px}
.ach-info p{font-size:12px;color:var(--muted)}

/* === МОДАЛЬНОЕ ОКНО === */
.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.8);z-index:300;display:flex;align-items:center;justify-content:center;padding:24px}
.modal-box{background:var(--card);border:1px solid var(--border);border-radius:22px;padding:26px;max-width:400px;width:100%;text-align:center}
.modal-box .emoji{font-size:64px;margin-bottom:12px}
.modal-box h2{font-size:22px;font-weight:800;margin-bottom:8px}
.modal-box p{color:var(--muted);font-size:14px;margin-bottom:20px;line-height:1.6}

@media(max-width:400px){
.days{grid-template-columns:repeat(5,1fr)}
.timer-display{font-size:44px}
}
</style>
</head>
